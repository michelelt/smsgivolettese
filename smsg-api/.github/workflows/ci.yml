name: ci
permissions: { contents: read }
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with: { version: 2.121.0 }
      - name: Start local Supabase and export test env
        run: |
          supabase start
          supabase db reset
          s=$(supabase status -o env)
          get() { grep -E "^$1=" <<<"$s" | head -n1 | cut -d= -f2- | tr -d '"'; }
          {
            echo "SUPABASE_URL=$(get API_URL)"
            echo "DATABASE_URL=$(get DB_URL)"
            echo "SUPABASE_SECRET_KEY=$(get SECRET_KEY)"
            echo "SUPABASE_PUBLISHABLE_KEY=$(get PUBLISHABLE_KEY)"
          } >> "$GITHUB_ENV"
      - run: pnpm test
      - run: pnpm openapi:export
      - run: git diff --exit-code openapi.json
      - name: Breaking changes vs main
        if: github.event_name == 'pull_request'
        run: |
          if git show origin/main:openapi.json > /tmp/base.json 2>/dev/null; then
            docker run --rm -v /tmp:/t -v "$PWD":/w tufin/oasdiff:v1.33.0 breaking /t/base.json /w/openapi.json --fail-on ERR
          else
            echo "No openapi.json on main, skipping"
          fi
