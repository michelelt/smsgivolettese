name: deploy
permissions: { contents: read }
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
concurrency: deploy-prod
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    environment: production
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: '${{ github.event.workflow_run.head_sha }}', persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit # full suite already ran in ci (deploy requires ci success)
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with: { version: 2.121.0 }
      - name: Push migrations to production
        run: |
          supabase link --project-ref "$SUPABASE_PROD_REF"
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROD_REF: ${{ secrets.SUPABASE_PROD_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
      - run: pnpm dlx vercel@64.3.1 pull --yes --environment=production --token "$VERCEL_TOKEN"
        env: { VERCEL_TOKEN: '${{ secrets.VERCEL_TOKEN }}' }
      - run: pnpm dlx vercel@64.3.1 build --prod --token "$VERCEL_TOKEN"
        env: { VERCEL_TOKEN: '${{ secrets.VERCEL_TOKEN }}' }
      - run: pnpm dlx vercel@64.3.1 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
        env: { VERCEL_TOKEN: '${{ secrets.VERCEL_TOKEN }}' }
