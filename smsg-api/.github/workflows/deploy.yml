name: deploy
on:
  push:
    branches: [main]
concurrency: deploy-prod
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - uses: supabase/setup-cli@v1
      - name: Push migrations to production
        run: |
          supabase link --project-ref "$SUPABASE_PROD_REF" --password "$SUPABASE_DB_PASSWORD_PROD"
          supabase db push --password "$SUPABASE_DB_PASSWORD_PROD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROD_REF: ${{ secrets.SUPABASE_PROD_REF }}
          SUPABASE_DB_PASSWORD_PROD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
      - run: pnpm dlx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
        env: { VERCEL_TOKEN: '${{ secrets.VERCEL_TOKEN }}' }
      - run: pnpm dlx vercel@latest build --prod --token "$VERCEL_TOKEN"
        env: { VERCEL_TOKEN: '${{ secrets.VERCEL_TOKEN }}' }
      - run: pnpm dlx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"
        env: { VERCEL_TOKEN: '${{ secrets.VERCEL_TOKEN }}' }
